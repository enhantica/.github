name: Feature request
description: Propose an improvement or a new capability
labels: ['[scope] enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it work? Alternatives you considered are welcome.
    validations:
      required: false
