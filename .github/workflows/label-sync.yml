name: Label sync

# Apply the EasyScience unified label standard (crysta ADR-0046 / ORG-0005) to the
# enhantica fleet (TARGET_REPOS in tools/update_github_labels.py — all ten repos since
# 2026-07-10, AUD-11). Monthly schedule catches drift between manual runs.
#
# Cross-repo note: the default GITHUB_TOKEN can only edit THIS repo's labels. Editing
# labels on the sibling repos needs a PAT stored as the secret LABELS_TOKEN (see README);
# a fine-grained PAT must list every TARGET_REPO as a resource.

on:
  schedule:
    - cron: '17 4 1 * *'   # monthly drift sweep (1st, 04:17 UTC)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo (owner/name); leave blank to sync the whole fleet'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (print the gh commands, change nothing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync labels
        env:
          # PAT (classic, `repo` scope) — the default GITHUB_TOKEN cannot edit sibling repos.
          GH_TOKEN: ${{ secrets.LABELS_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.repo }}" ]; then
            args+=(--repo "${{ inputs.repo }}")
          else
            args+=(--all)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python tools/update_github_labels.py "${args[@]}"
